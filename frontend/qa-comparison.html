<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CórnerOps AI Design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #dbe3eb; background: #05080c; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 18px; font-size: 22px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
      figure { margin: 0; padding: 12px; background: #0d131a; border: 1px solid #22303d; border-radius: 8px; }
      figcaption { margin-bottom: 10px; color: #45dc78; font-size: 12px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <h1>AI Mission Control: source and implementation</h1>
    <main>
      <figure><figcaption>Source visual</figcaption><img src="/qa-reference.png" alt="Source visual" /></figure>
      <figure><figcaption>Implementation</figcaption><img src="/qa-implementation.png" alt="Implementation" /></figure>
    </main>
  </body>
</html>
