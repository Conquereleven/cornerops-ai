name: CornerOps Prod Watch

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cornerops-prod-watch
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_URL: https://cornerops-ai-production.up.railway.app
      CONTROL_TOWER_OPERATOR_TOKEN: ${{ secrets.CONTROL_TOWER_OPERATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # curl is supplied by ubuntu-latest; no Node or application dependencies.
      - name: Check production health, authentication and API containment
        run: bash .github/scripts/prod-watch.sh
