name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/openclaw-integration

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend
        run: npm ci

      - name: Install frontend
        run: npm --prefix frontend ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm test

      - name: Test frontend
        run: npm run test:frontend

      - name: Build
        run: npm run build
