name: CI

on:
  pull_request:
    # Documentation-only changes cannot affect the production build.
    # Runtime/infra source changes still run the full existing test job.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend
        run: npm ci

      - name: Install frontend
        run: npm --prefix frontend ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm test

      - name: Test frontend
        run: npm run test:frontend

      - name: Build
        run: npm run build

      - name: Safe beta demos
        run: npm run control:tower && npm run demo:beta
