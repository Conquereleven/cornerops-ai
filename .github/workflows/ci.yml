name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# Only superseded feature PR validation is disposable. Unique run IDs keep
# main/develop pushes and release/hotfix/security PR validation independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/') && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend
        run: npm ci

      - name: Install frontend
        run: npm --prefix frontend ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm test

      - name: Test frontend
        run: npm run test:frontend

      - name: Build
        run: npm run build

      - name: Safe beta demos
        run: npm run control:tower && npm run demo:beta
