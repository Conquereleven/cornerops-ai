name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job ids and names are stable: they are the required checks named in
# docs/runbooks/github-protection-v1.md.
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cornerops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable database for migration tests. Never a real environment.
      CORNEROPS_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/cornerops_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend
        run: npm ci

      - name: Install frontend
        run: npm --prefix frontend ci

      - name: Secret scan
        run: npm run security:secret-scan

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Route inventory is current
        run: npm run security:route-inventory:check

      - name: Security tests (auth, authorization, API boundary, migrations)
        run: npm run test:security

      - name: Test backend
        run: npm test

      - name: Test frontend
        run: npm run test:frontend

      - name: Build
        run: npm run build

      - name: Safe beta demos
        run: npm run control:tower && npm run demo:beta
